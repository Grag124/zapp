[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    esp32-camera
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32CAM
src_dir = src
lib_dir = lib

[env:esp32cam-debug]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    esp32-camera
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32CAM
    -DDEBUG_MOTOR_CONTROL=1
src_dir = src
lib_dir = lib
