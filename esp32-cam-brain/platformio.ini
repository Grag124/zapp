[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    esp32-camera
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32CAM
    -DPHASE0_SIMULATION=0
src_dir = src
include_dir = include
lib_dir = lib

[env:esp32cam-debug]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    esp32-camera
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32CAM
    -DDEBUG_BRAIN=1
    -DPHASE0_SIMULATION=0
src_dir = src
include_dir = include
lib_dir = lib

[env:phase0-sim]
platform = native
framework = arduino
build_flags = 
    -DPHASE0_SIMULATION=1
    -DARDUINO_ARCH_ESP32=1
src_dir = src
include_dir = include
build_unity = yes
test_external_tool = true
